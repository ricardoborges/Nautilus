<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Nautilus - Server Manager</title>
    <meta name="description" content="Aplicação para gerenciamento de servidores Linux via SSH" />
    <!--
      NOTE: do not add inline <style> or <script> tags to this file.
      Tauri stamps a nonce onto every inline <style> at build time and adds it to
      the style-src CSP directive at runtime, which per the CSP spec makes
      'unsafe-inline' be ignored - that blocks every style Ant Design injects at
      runtime and leaves the whole UI unstyled. Keep pre-mount styles in
      src/index.css and pre-mount scripts in src/main.tsx instead.
    -->
</head>

<body class="overflow-hidden h-screen w-screen select-none">
    <!-- React Root -->
    <div id="root"></div>

    <!-- React Entry Point -->
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
